</head>

    <script>
        const vocabData = {
            greetings: {
                title: "1. Greetings & Openers — التحيات والافتتاحيات",

                    { word: "Take care", meaning: "اعتني بنفسك", type: "تعبير (Expression)", example: "Bye and take care of yourself.", exampleAr: "مع السلامة واعتني بنفسك.", tip: "تعبير دافئ للوداع والتمني بالسلامة." }

                ]
            },
            hotelTravel: {
                title: "5. Hotel & Travel — الفندق والسفر",
                items: [
                    { word: "Hotel", meaning: "فندق", type: "اسم (Noun)", example: "This hotel is luxurious.", exampleAr: "هذا الفندق فاخر.", tip: "مكان إقامة المسافرين." },
                    { word: "Reception desk", meaning: "مكتب الاستقبال", type: "اسم (Noun)", example: "Ask at the reception desk for a key.", exampleAr: "اسأل في مكتب الاستقبال عن مفتاح.", tip: "النقطة الأولى لاستقبال الزوار في الفندق." },
                    { word: "Reservation", meaning: "حجز", type: "اسم (Noun)", example: "I have a hotel room reservation.", exampleAr: "لدي حجز غرفة في الفندق.", tip: "تأكيد مكان مسبق." },
                    { word: "Key card", meaning: "بطاقة المفتاح", type: "اسم (Noun)", example: "Use your key card to open the door.", exampleAr: "استخدم بطاقة المفتاح لفتح الباب.", tip: "بطاقة إلكترونية لفتح الغرف." },
                    { word: "Credit card", meaning: "بطاقة ائتمان", type: "اسم (Noun)", example: "Can I pay with a credit card?", exampleAr: "هل يمكنني الدفع ببطاقة الائتمان؟", tip: "بطاقة بنكية للدفع." },
                    { word: "Elevator", meaning: "مصعد / أسانسير", type: "اسم (Noun)", example: "Take the elevator to the third floor.", exampleAr: "خذ المصعد إلى الطابق الثالث.", tip: "جهاز الصعود والنزول في المباني." },
                    { word: "Concierge", meaning: "موظف الاستعلامات", type: "اسم (Noun)", example: "The concierge helped with our bags.", exampleAr: "ساعدنا موظف الاستعلامات في حقائبنا.", tip: "مسؤول مساعدة النزلاء في الفندق." },
                    { word: "Festival", meaning: "مهرجان", type: "اسم (Noun)", example: "The city festival is amazing.", exampleAr: "مهرجان المدينة مذهل.", tip: "احتفال كبير وفعاليات جماعية." }
                ]
            },
            verbs: {
                title: "6. Key Verbs — الأفعال الرئيسية",
                items: [
                    { word: "check into", meaning: "يسجل الدخول في فندق", type: "فعل مركب (Verb Phr.)", example: "We will check into the hotel now.", exampleAr: "سنسجل دخولنا في الفندق الآن.", tip: "إجراءات الوصول للفندق." },
                    { word: "fill in", meaning: "يعبئ نموذجاً", type: "فعل مركب (Verb Phr.)", example: "Please fill in this form.", exampleAr: "من فضلك املأ هذا النموذج.", tip: "كتابة البيانات في الفراغات." },
                    { word: "greet", meaning: "يحيي", type: "فعل (Verb)", example: "He greeted the guests politely.", exampleAr: "حيّا الضيوف بأدب.", tip: "إلقاء التحية." },
                    { word: "introduce", meaning: "يُقدم شخصاً", type: "فعل (Verb)", example: "Let me introduce my brother.", exampleAr: "دعني أقدم أخي.", tip: "التعريف بشخص." },
                    { word: "pay for", meaning: "يدفع مقابل", type: "فعل (Verb)", example: "I need to pay for the room.", exampleAr: "أحتاج لدفع ثمن الغرفة.", tip: "تسديد المبلغ المالي." },
                    { word: "spell", meaning: "يهجئ الحروف", type: "فعل (Verb)", example: "How do you spell your name?", exampleAr: "كيف تهجئ اسمك؟", tip: "ذكر الحروف فرادى." },
                    { word: "stay in", meaning: "يقيم في", type: "فعل (Verb)", example: "We stay in a nice hotel.", exampleAr: "نقيم في فندق جميل.", tip: "المكوث في مكان." }
                ]
            },
            expressions: {
                title: "7. Real Talk & Expressions — تعبيرات واقعية",
                items: [
                    { word: "on vacation", meaning: "في إجازة", type: "تعبير (Expression)", example: "Are you here on vacation?", exampleAr: "هل أنت هنا في إجازة؟", tip: "قضاء وقت راحة وسفر." },
                    { word: "on business", meaning: "في رحلة عمل", type: "تعبير (Expression)", example: "No, I am here on business.", exampleAr: "لا، أنا هنا في رحلة عمل.", tip: "السفر بغرض العمل والمهام المهنية." },

                    { word: "Have a nice stay", meaning: "أتمنى لك إقامة طيبة", type: "تعبير (Expression)", example: "Welcome and have a nice stay!", exampleAr: "أهلاً بك ونتمنى لك إقامة طيبة!", tip: "تمني طيب للنزلاء." },

                    { word: "That's all right", meaning: "لا بأس / لا عليك", type: "تعبير (Expression)", example: "That's all right, don't worry.", exampleAr: "لا بأس، لا تقلق.", tip: "الرد على الاعتذار." },
                    { word: "Thank you so much", meaning: "شكراً جزيلاً", type: "تعبير (Expression)", example: "Thank you so much for your help.", exampleAr: "شكراً جزيلاً على مساعدة.", tip: "شكر عميق." },
                    { word: "You're welcome", meaning: "على الرحب والسعة", type: "تعبير (Expression)", example: "You're welcome anytime.", exampleAr: "على الرحب والسعة في أي وقت.", tip: "الرد على الشكر." }

        let state = {
            currentScreen: 'home',
            activeVocabCategory: null,
            activeGrammarLevel: 1,
            learnedWords: JSON.parse(localStorage.getItem('sg2_learnedWords')) || [],
            points: parseInt(localStorage.getItem('sg2_points')) || 0,
            stars: parseInt(localStorage.getItem('sg2_stars')) || 0,
            completedLevels: JSON.parse(localStorage.getItem('sg2_completedLevels')) || { vocab: [], grammar: [1] },
            examScores: JSON.parse(localStorage.getItem('sg2_examScores')) || {},
            screenHistory: ['home']
        };

        function saveState() {
            localStorage.setItem('sg2_learnedWords', JSON.stringify(state.learnedWords));
            localStorage.setItem('sg2_points', state.points);
            localStorage.setItem('sg2_stars', state.stars);
            localStorage.setItem('sg2_completedLevels', JSON.stringify(state.completedLevels));
            localStorage.setItem('sg2_examScores', JSON.stringify(state.examScores));
            updateHeader();
        }

        function updateHeader() {
            document.getElementById('headerStars').innerText = state.stars;
            document.getElementById('headerPoints').innerText = state.points;
        }

        function navigateTo(screen, params = {}) {
            if (state.currentScreen !== screen) {
                state.screenHistory.push(screen);
            }
            state.currentScreen = screen;
            if (params.category) state.activeVocabCategory = params.category;
            if (params.grammarLevel) state.activeGrammarLevel = params.grammarLevel;

            const navContainer = document.getElementById('navBarContainer');
            if (state.currentScreen === 'home') {
                navContainer.classList.add('hidden');
                state.screenHistory = ['home'];
            } else {
                navContainer.classList.remove('hidden');
            }

            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goBack() {
            if (state.screenHistory.length > 1) {
                state.screenHistory.pop();
                state.currentScreen = state.screenHistory[state.screenHistory.length - 1];
                if (state.currentScreen === 'home') {
                    document.getElementById('navBarContainer').classList.add('hidden');
                }
                render();
            } else {
                navigateTo('home');
            }
        }

        function showModal(title, message, icon = '🌟') {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('modalIcon').innerText = icon;
            document.getElementById('customModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('customModal').classList.add('hidden');
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            } else {
                showModal('النطق غير متوفر', 'متصفحك لا يدعم خاصية التحدث الصوتي.', '⚠️');
            }
        }

        function render() {
            updateHeader();
            const main = document.getElementById('mainView');
            
            switch (state.currentScreen) {
                case 'home':
                    main.innerHTML = renderHomeScreen();
                    break;
                case 'vocabMenu':
                    main.innerHTML = renderVocabMenuScreen();
                    break;
                case 'vocabLearn':
                    main.innerHTML = renderVocabLearnScreen();
                    break;
                case 'vocabGames':
                    main.innerHTML = renderVocabGamesScreen();
                    break;
                case 'vocabExam':
                    main.innerHTML = renderVocabExamScreen();
                    break;
                case 'grammarMenu':
                    main.innerHTML = renderGrammarMenuScreen();
                    break;
                case 'grammarLearn':
                    main.innerHTML = renderGrammarLearnScreen();
                    break;
                case 'grammarExam':
                    main.innerHTML = renderGrammarExamScreen();
                    break;
                case 'reviewMenu':
                    main.innerHTML = renderReviewScreen();
                    break;
                case 'progressMenu':
                    main.innerHTML = renderProgressScreen();
                    break;
                case 'achievementsMenu':
                    main.innerHTML = renderAchievementsScreen();
                    break;
                default:
                    main.innerHTML = renderHomeScreen();
            }
        }

        function renderHomeScreen() {
            return `
                <div class="space-y-8">
                    <div class="glass-card rounded-3xl p-8 md:p-10 text-center relative overflow-hidden shadow-2xl border-2 border-indigo-500/40">
                        <span class="inline-block px-5 py-2 bg-indigo-500/20 text-indigo-300 rounded-full text-sm font-black mb-4 border border-indigo-500/40">
                            SuperGoal 2 — Unit 1: Are You Here on Vacation?
                        </span>
                        <h2 class="text-3xl md:text-5xl font-black text-white mb-4 leading-snug">
                            مرحباً بك في مغامرة تعلم الإنجليزية! ✈️
                        </h2>
                        <p class="text-slate-200 text-base md:text-lg max-w-3xl mx-auto mb-6 leading-relaxed font-semibold">
                            تعلم المفردات وقواعد الفندق والسفر (Verb Be, Wh- Questions, Prepositions) بطريقة تفاعلية مبسطة تشبه الشرح الفردي خطوة بخطوة.
                        </p>
                        <div class="inline-flex items-center gap-3 bg-slate-900/95 px-6 py-3 rounded-2xl border border-slate-700 text-sm font-black text-amber-300 shadow">
                            <span>🎓 إشراف: د. محسن الكاشف</span>
                            <span>•</span>
                            <span>Online Teacher Hub</span>
                        </div>
                    </div>

                    <!-- Main Navigation Cards -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <div onclick="navigateTo('vocabMenu')" class="glass-card rounded-3xl p-8 hover:border-indigo-500 cursor-pointer transition-all duration-300 group shadow-xl flex flex-col justify-between">
                            <div>
                                <div class="w-16 h-16 rounded-2xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-4xl mb-6 group-hover:scale-110 transition-transform">
                                    📚
                                </div>
                                <h3 class="text-xl font-black text-white mb-2">Vocabulary — المفردات</h3>
                                <p class="text-sm text-slate-300 font-semibold leading-relaxed">تعلم كلمات التحيات، الفندق والسفر، والمعلومات الشخصية بالنطق والأمثلة والامتحانات المخصصة.</p>
                            </div>

        function renderVocabMenuScreen() {
            let html = `
                <div class="space-y-6">
                    <div class="glass-card rounded-3xl p-8 border border-indigo-500/40 shadow-xl">
                        <h2 class="text-2xl md:text-3xl font-black text-white mb-3">📚 قسم المفردات — Vocabulary</h2>
                        <p class="text-sm md:text-base text-slate-200 font-semibold">اختر إحدى المجموعات للتعلم والتدرب أو قم بإجراء اختبار الكلمات الشامل.</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            `;

            for (const [key, category] of Object.entries(vocabData)) {
                let learnedCount = category.items.filter(item => state.learnedWords.includes(item.word)).length;
                let totalCount = category.items.length;
                let percent = Math.round((learnedCount / totalCount) * 100);

                html += `
                    <div class="glass-card rounded-3xl p-6 border border-slate-700 hover:border-indigo-500 transition-all shadow-xl flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-4">
                                <h3 class="font-black text-white text-lg">${category.title}</h3>
                                <span class="text-xs bg-slate-800 text-indigo-300 px-3.5 py-1.5 rounded-xl border border-slate-600 font-bold">${totalCount} كلمات</span>
                            </div>
                            <div class="w-full bg-slate-900 rounded-full h-3.5 mb-3 overflow-hidden border border-slate-800">
                                <div class="bg-gradient-to-r from-indigo-500 to-purple-500 h-3.5 rounded-full" style="width: ${percent}%"></div>
                            </div>
                            <p class="text-xs md:text-sm text-slate-300 font-semibold">تم إتقان ${learnedCount} من ${totalCount} (${percent}%)</p>
                        </div>
                        <div class="mt-6 flex flex-wrap gap-3">
                            <button onclick="navigateTo('vocabLearn', {category: '${key}'})" class="flex-1 py-3 px-4 btn-gradient text-white text-xs md:text-sm font-black rounded-2xl shadow">
                                تعلم واستعراض 📖
                            </button>
                            <button onclick="navigateTo('vocabGames', {category: '${key}'})" class="py-3 px-5 bg-slate-800 hover:bg-slate-700 text-slate-100 text-xs md:text-sm font-black rounded-2xl border border-slate-600 shadow">
                                الألعاب 🎮
                            </button>
                            <button onclick="navigateTo('vocabExam', {category: '${key}'})" class="py-3 px-5 bg-indigo-900 hover:bg-indigo-800 text-indigo-200 text-xs md:text-sm font-black rounded-2xl border border-indigo-700 shadow">
                                اختبار 📝
                            </button>
                        </div>
                    </div>
                `;
            }

            html += `</div></div>`;
            return html;
        }

        let currentLearnIndex = 0;
        function renderVocabLearnScreen() {
            const category = vocabData[state.activeVocabCategory];
            if (!category) return `<div class="p-6 text-center">عذراً، المجموعة غير موجودة.</div>`;
            
            if (currentLearnIndex >= category.items.length) currentLearnIndex = 0;
            if (currentLearnIndex < 0) currentLearnIndex = category.items.length - 1;

            const item = category.items[currentLearnIndex];
            const isLearned = state.learnedWords.includes(item.word);

            return `
                <div class="space-y-6 max-w-2xl mx-auto">
                    <div class="glass-card rounded-3xl p-6 flex justify-between items-center border border-slate-700 shadow-xl">
                        <h3 class="font-black text-white text-base md:text-lg">${category.title}</h3>
                        <span class="text-xs md:text-sm bg-indigo-500/20 text-indigo-300 px-4 py-1.5 rounded-xl font-black border border-indigo-500/30">الكلمة ${currentLearnIndex + 1} من ${category.items.length}</span>
                    </div>

                    <div class="glass-card rounded-3xl p-8 md:p-10 border-2 border-indigo-500/50 shadow-2xl space-y-8 text-center relative">
                        <div class="absolute top-6 left-6">
                            <button onclick="speakText('${item.word}')" class="w-14 h-14 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl flex items-center justify-center text-2xl shadow-xl transition-transform hover:scale-105" title="استمع للنطق الأمريكي">
                                🔊
                            </button>
                        </div>

                        <div class="pt-4">
                            <span class="text-xs md:text-sm bg-purple-500/20 text-purple-300 px-4 py-1.5 rounded-full border border-purple-500/40 font-black">${item.type}</span>
                            <h2 class="text-4xl md:text-5xl font-black text-white mt-4 mb-2 tracking-wide ltr-text text-center">${item.word}</h2>
                            <p class="text-2xl md:text-3xl font-black text-amber-400 mb-6">${item.meaning}</p>
                        </div>

                        <div class="bg-slate-900/90 p-6 rounded-3xl border border-slate-800 text-right space-y-3 shadow-inner">
                            <p class="text-base font-black text-slate-100">🇬🇧 Example: <span class="text-indigo-300 font-semibold ltr-text inline-block">${item.example}</span></p>
                            <p class="text-base font-black text-slate-100">🇸🇦 الترجمة: <span class="text-slate-300 font-semibold">${item.exampleAr}</span></p>
                            <p class="text-sm text-amber-300 font-bold pt-3 border-t border-slate-800">💡 توضيح: ${item.tip}</p>
                        </div>

                        <div>
                            ${isLearned ? 
                                `<div class="inline-flex items-center gap-3 bg-emerald-500/20 text-emerald-300 px-6 py-3 rounded-2xl text-sm font-black border border-emerald-500/40">
                                    <span>✅ تم إتقان هذه الكلمة (+1 نقطة ونجمة منحت مرة واحدة)</span>
                                </div>` :
                                `<button onclick="markWordLearned('${item.word}')" class="py-4 px-8 btn-gradient text-white text-base font-black rounded-2xl shadow-lg">
                                    أتقنت هذه الكلمة ⭐ (احصل على نقطة ونجمة)
                                </button>`
                            }
                        </div>
                    </div>

                    <div class="flex justify-between items-center gap-6">
                        <button onclick="currentLearnIndex--; render();" class="flex-1 py-4 bg-slate-800 hover:bg-slate-700 text-white font-black rounded-2xl border border-slate-700 shadow text-base">
                            ⬅ الكلمة السابقة
                        </button>
                        <button onclick="currentLearnIndex++; render();" class="flex-1 py-4 btn-gradient text-white font-black rounded-2xl shadow text-base">
                            الكلمة التالية ➡
                        </button>
                    </div>
                </div>
            `;
        }

        function markWordLearned(word) {
            if (!state.learnedWords.includes(word)) {
                state.learnedWords.push(word);
                state.points += 1;
                state.stars += 1;
                saveState();
                showModal('أحسنت!', `لقد أتقنت الكلمة "${word}" وحصلت على نقطة ونجمة جديدة!`, '⭐');
                render();
            }
        }

        let currentGameType = 'matching';
        let gameActiveData = null;

        function renderVocabGamesScreen() {
            const category = vocabData[state.activeVocabCategory];
            if (!category) return `<div class="p-6 text-center">عذراً، المجموعة غير موجودة.</div>`;

            return `
                <div class="space-y-6 max-w-2xl mx-auto">
                    <div class="glass-card rounded-3xl p-6 border border-indigo-500/40 shadow-xl space-y-4">
                        <div>
                            <h3 class="font-black text-white text-lg">🎮 ألعاب المفردات التفاعلية (SuperGoal 2)</h3>
                            <p class="text-sm text-indigo-300 font-bold mt-1">${category.title}</p>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-3 border-t border-slate-700">
                            <button onclick="setVocabGameType('matching')" class="tab-btn px-3 py-3.5 text-xs md:text-sm font-black rounded-2xl border ${currentGameType === 'matching' ? 'active' : 'bg-slate-900 border-slate-700 text-slate-300 hover:bg-slate-800'}">🔗 توصيل</button>
                            <button onclick="setVocabGameType('mcq')" class="tab-btn px-3 py-3.5 text-xs md:text-sm font-black rounded-2xl border ${currentGameType === 'mcq' ? 'active' : 'bg-slate-900 border-slate-700 text-slate-300 hover:bg-slate-800'}">🎯 اختيار المعنى</button>
                            <button onclick="setVocabGameType('completeWord')" class="tab-btn px-3 py-3.5 text-xs md:text-sm font-black rounded-2xl border ${currentGameType === 'completeWord' ? 'active' : 'bg-slate-900 border-slate-700 text-slate-300 hover:bg-slate-800'}">✍️ إكمال الكلمة</button>
                            <button onclick="setVocabGameType('completeSentence')" class="tab-btn px-3 py-3.5 text-xs md:text-sm font-black rounded-2xl border ${currentGameType === 'completeSentence' ? 'active' : 'bg-slate-900 border-slate-700 text-slate-300 hover:bg-slate-800'}">📝 إكمال الجملة</button>
                        </div>
                    </div>

                    <div id="gameContainer" class="glass-card rounded-3xl p-8 border border-slate-700 shadow-xl">
                        ${renderActiveVocabGame(category)}
                    </div>
                </div>
            `;
        }

        function setVocabGameType(type) {
            currentGameType = type;
            gameActiveData = null;
            render();
        }

        function renderActiveVocabGame(category) {
            if (!gameActiveData) {
                const items = [...category.items].sort(() => 0.5 - Math.random()).slice(0, 4);
                if (currentGameType === 'matching') {
                    gameActiveData = {
                        items: items,
                        shuffledMeanings: [...items].sort(() => 0.5 - Math.random()),
                        selectedWord: null,
                        matches: {}
                    };
                } else if (currentGameType === 'mcq') {
                    const target = items[0];
                    const distractors = category.items.filter(i => i.word !== target.word).sort(() => 0.5 - Math.random()).slice(0, 3);
                    const options = [target, ...distractors].sort(() => 0.5 - Math.random());
                    gameActiveData = { target, options, answered: false };
                } else if (currentGameType === 'completeWord') {
                    const target = items[0];
                    let word = target.word;
                    let hiddenIndex = Math.floor(Math.random() * Math.min(word.length, 5));
                    let maskedWord = word.split('');
                    let correctChar = maskedWord[hiddenIndex];
                    maskedWord[hiddenIndex] = '_';
                    let distractors = ['a', 'e', 'i', 'o', 'u', 't', 's', 'r', 'n', 'c'].filter(c => c !== correctChar.toLowerCase()).slice(0, 3);
                    let options = [correctChar, ...distractors].sort(() => 0.5 - Math.random());
                    gameActiveData = { target, maskedWord: maskedWord.join(''), correctChar, options, answered: false };
                } else if (currentGameType === 'completeSentence') {
                    const target = items[0];
                    const distractors = category.items.filter(i => i.word !== target.word).sort(() => 0.5 - Math.random()).slice(0, 3);
                    const options = [target, ...distractors].sort(() => 0.5 - Math.random());
                    gameActiveData = { target, options, answered: false };
                }
            }

            if (currentGameType === 'matching') {
                const data = gameActiveData;
                let allMatched = Object.keys(data.matches).length === data.items.length;

                if (allMatched) {
                    return `
                        <div class="text-center space-y-6 py-8">
                            <div class="text-6xl">🏆</div>
                            <h3 class="text-2xl font-black text-white">رائع! أكملت لعبة التوصيل بنجاح</h3>
                            <button onclick="gameActiveData = null; render();" class="py-4 px-8 btn-gradient text-white font-black rounded-2xl shadow text-base">العب مرة أخرى 🔄</button>
                        </div>
                    `;
                }

                return `
                    <div class="space-y-6">
                        <p class="text-sm text-slate-300 font-bold text-center">اضغط على الكلمة الإنجليزية ثم اضغط على المعنى العربي المطابق:</p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                            <div class="space-y-3">
                                <h4 class="text-xs font-black text-indigo-400 text-center">الكلمات الإنجليزية</h4>
                                ${data.items.map(item => {
                                    const isMatched = Object.keys(data.matches).includes(item.word);
                                    const isSelected = data.selectedWord === item.word;
                                    return `
                                        <button type="button" ${isMatched ? 'disabled' : ''} onclick="selectGameWord('${item.word.replace(/'/g, "\\'")}')" class="w-full p-4 rounded-2xl text-base font-black ltr-text border transition-all cursor-pointer ${isMatched ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300 opacity-50' : isSelected ? 'bg-indigo-600 border-indigo-400 text-white shadow-xl scale-105' : 'bg-slate-900 border-slate-700 text-slate-100 hover:bg-slate-800'}">
                                            ${item.word} ${isMatched ? '✓' : ''}
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                            <div class="space-y-3">
                                <h4 class="text-xs font-black text-purple-400 text-center">المعاني العربية</h4>
                                ${data.shuffledMeanings.map(item => {
                                    const isMatched = Object.values(data.matches).includes(item.meaning);
                                    return `
                                        <button type="button" ${isMatched ? 'disabled' : ''} onclick="selectGameMeaning('${item.meaning.replace(/'/g, "\\'")}', '${item.word.replace(/'/g, "\\'")}')" class="w-full p-4 rounded-2xl text-base font-black text-right border transition-all cursor-pointer ${isMatched ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300 opacity-50' : 'bg-slate-900 border-slate-700 text-slate-100 hover:bg-slate-800'}">
                                            ${item.meaning} ${isMatched ? '✓' : ''}
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentGameType === 'mcq') {
                const data = gameActiveData;
                return `
                    <div class="space-y-6 text-center">
                        <div class="flex justify-center">
                            <button onclick="speakText('${data.target.word}')" class="px-5 py-3 bg-indigo-600 text-white rounded-2xl text-sm font-black shadow-lg">🔊 استمع للكلمة</button>
                        </div>
                        <h3 class="text-3xl font-black text-white ltr-text text-center">${data.target.word}</h3>
                        <p class="text-sm text-slate-300 font-bold">ما هو المعنى الصحيح لهذه الكلمة؟</p>
                        
                        <div class="grid grid-cols-1 gap-3 pt-3">
                            ${data.options.map(opt => {
                                let btnClass = 'bg-slate-900 border-slate-700 text-slate-100 hover:bg-slate-800';
                                if (data.answered) {
                                    if (opt.word === data.target.word) btnClass = 'bg-emerald-600/40 border-emerald-500 text-emerald-200';
                                    else if (opt.selected) btnClass = 'bg-rose-600/40 border-rose-500 text-rose-200';
                                }
                                return `
                                    <button type="button" ${data.answered ? 'disabled' : ''} onclick="checkMCQ('${opt.word.replace(/'/g, "\\'")}', '${data.target.word.replace(/'/g, "\\'")}')" class="w-full p-4.5 rounded-2xl text-base font-black border transition-all cursor-pointer ${btnClass}">
                                        ${opt.meaning}
                                    </button>
                                `;
                            }).join('')}
                        </div>
                        ${data.answered ? `
                            <button onclick="gameActiveData = null; render();" class="mt-6 py-4 px-8 btn-gradient text-white text-sm font-black rounded-2xl shadow">السؤال التالي ➡</button>
                        ` : ''}
                    </div>
                `;
            } else if (currentGameType === 'completeWord') {
                const data = gameActiveData;
                return `
                    <div class="space-y-6 text-center">
                        <p class="text-sm text-slate-300 font-bold">أكمل الحرف الناقص في الكلمة التالية:</p>
                        <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 text-3xl font-black tracking-widest text-indigo-300 ltr-text text-center">
                            ${data.maskedWord}
                        </div>
                        <p class="text-sm text-amber-300 font-bold">المعنى: ${data.target.meaning}</p>
                        
                        <div class="grid grid-cols-2 gap-4 pt-3">
                            ${data.options.map(char => {
                                let btnClass = 'bg-slate-900 border-slate-700 text-slate-100 hover:bg-slate-800';
                                if (data.answered) {
                                    if (char.toLowerCase() === data.correctChar.toLowerCase()) btnClass = 'bg-emerald-600/40 border-emerald-500 text-emerald-200';
                                    else if (char === data.selectedChar) btnClass = 'bg-rose-600/40 border-rose-500 text-rose-200';
                                }
                                return `
                                    <button type="button" ${data.answered ? 'disabled' : ''} onclick="checkCompleteWord('${char}', '${data.correctChar}')" class="p-4 rounded-2xl text-xl font-black uppercase border transition-all cursor-pointer ltr-text text-center ${btnClass}">
                                        ${char}
                                    </button>
                                `;
                            }).join('')}
                        </div>
                        ${data.answered ? `
                            <button onclick="gameActiveData = null; render();" class="mt-6 py-4 px-8 btn-gradient text-white text-sm font-black rounded-2xl shadow">السؤال التالي ➡</button>
                        ` : ''}
                    </div>
                `;
            } else if (currentGameType === 'completeSentence') {
                const data = gameActiveData;
                let sentenceWithBlank = data.target.example.replace(new RegExp(data.target.word, 'gi'), '_____');
                return `
                    <div class="space-y-6 text-center">
                        <p class="text-sm text-slate-300 font-bold">اختر الكلمة المناسبة لإكمال الجملة:</p>
                        <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 text-lg font-black text-indigo-300 leading-relaxed shadow-inner ltr-text text-center">
                            "${sentenceWithBlank}"
                        </div>
                        <p class="text-sm text-slate-400 font-bold">(${data.target.exampleAr})</p>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-3">
                            ${data.options.map(opt => {
                                let btnClass = 'bg-slate-900 border-slate-700 text-slate-100 hover:bg-slate-800';
                                if (data.answered) {
                                    if (opt.word === data.target.word) btnClass = 'bg-emerald-600/40 border-emerald-500 text-emerald-200';
                                    else if (opt.selected) btnClass = 'bg-rose-600/40 border-rose-500 text-rose-200';
                                }
                                return `
                                    <button type="button" ${data.answered ? 'disabled' : ''} onclick="checkCompleteSentence('${opt.word.replace(/'/g, "\\'")}', '${data.target.word.replace(/'/g, "\\'")}')" class="p-4 rounded-2xl text-sm font-black border transition-all cursor-pointer ltr-text text-center ${btnClass}">
                                        ${opt.word}
                                    </button>
                                `;
                            }).join('')}
                        </div>
                        ${data.answered ? `
                            <button onclick="gameActiveData = null; render();" class="mt-6 py-4 px-8 btn-gradient text-white text-sm font-black rounded-2xl shadow">السؤال التالي ➡</button>
                        ` : ''}
                    </div>
                `;
            }
        }

        function selectGameWord(word) {
            gameActiveData.selectedWord = word;
            render();
        }

        function selectGameMeaning(meaning, targetWord) {
            if (!gameActiveData.selectedWord) return;
            if (gameActiveData.selectedWord === targetWord) {
                gameActiveData.matches[targetWord] = meaning;
                speakText(targetWord);
                state.points += 1;
                saveState();
            }
            gameActiveData.selectedWord = null;
            render();
        }

        function checkMCQ(selectedWord, targetWord) {
            gameActiveData.answered = true;
            gameActiveData.options.forEach(o => { if (o.word === selectedWord) o.selected = true; });
            if (selectedWord === targetWord) {
                state.points += 2;
                saveState();
            }
            render();
        }

        function checkCompleteWord(selectedChar, correctChar) {
            gameActiveData.answered = true;
            gameActiveData.selectedChar = selectedChar;
            if (selectedChar.toLowerCase() === correctChar.toLowerCase()) {
                state.points += 2;
                saveState();
            }
            render();
        }

        function checkCompleteSentence(selectedWord, targetWord) {
            gameActiveData.answered = true;
            gameActiveData.options.forEach(o => { if (o.word === selectedWord) o.selected = true; });
            if (selectedWord === targetWord) {
                state.points += 2;
                saveState();
            }
            render();
        }

        let vocabExamState = {
            category: null,
            questions: [],
            currentIndex: 0,
            userAnswers: {},
            submitted: false,
            score: 0
        };

        function renderVocabExamScreen() {
            const categoryKey = state.activeVocabCategory;
            const category = vocabData[categoryKey];
            if (!vocabExamState.questions.length || vocabExamState.category !== categoryKey) {
                initVocabExam(categoryKey);
            }

            const q = vocabExamState.questions[vocabExamState.currentIndex];

            if (vocabExamState.submitted) {
                let passed = vocabExamState.score >= 8; // out of 10
                return `
                    <div class="glass-card rounded-3xl p-8 md:p-10 max-w-2xl mx-auto text-center space-y-6 border border-slate-700 shadow-2xl">
                        <div class="text-6xl">${passed ? '🏆' : '⚠️'}</div>
                        <h3 class="text-3xl font-black text-white">نتيجة اختبار مفردات: ${category.title}</h3>
                        <div class="text-4xl font-black ${passed ? 'text-emerald-400' : 'text-rose-400'}">
                            ${vocabExamState.score} / 10
                        </div>
                        <p class="text-base font-semibold text-slate-200">
                            ${passed ? 'مبارك! لقد اجتزت اختبار المفردات بنجاح!' : 'لم تصل لدرجة النجاح (8 من 10). راجع الكلمات وحاول مرة أخرى.'}
                        </p>

                        <div class="space-y-3 text-right max-h-60 overflow-y-auto p-3">
                            <h4 class="font-black text-white text-sm">مراجعة الأسئلة:</h4>
                            ${vocabExamState.questions.map((quest, idx) => {
                                let userAns = vocabExamState.userAnswers[idx];
                                let isCorr = userAns === quest.correct;
                                return `
                                    <div class="p-4 rounded-2xl bg-slate-900 border ${isCorr ? 'border-emerald-500/40 text-emerald-300' : 'border-rose-500/40 text-rose-300'} text-xs md:text-sm space-y-1">
                                        <p class="font-black text-white ltr-text">${idx + 1}. ${quest.question}</p>
                                        <p>إجابتك: ${userAns !== undefined ? quest.options[userAns] : 'لم تقم بالإجابة'} ${isCorr ? '✅' : '❌'}</p>
                                        ${!isCorr ? `<p class="text-emerald-400 font-bold">الإجابة الصحيحة: ${quest.options[quest.correct]}</p>` : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        <div class="flex gap-4 pt-4">
                            <button onclick="initVocabExam('${categoryKey}'); render();" class="flex-1 py-4 bg-slate-800 hover:bg-slate-700 text-white font-black rounded-2xl border border-slate-700 text-sm">
                                إعادة الاختبار بأسئلة جديدة 🔄
                            </button>
                            <button onclick="navigateTo('vocabMenu')" class="flex-1 py-4 btn-gradient text-white font-black rounded-2xl text-sm">
                                العودة لقائمة المفردات 📚
                            </button>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="glass-card rounded-3xl p-8 md:p-10 max-w-2xl mx-auto space-y-6 border border-slate-700 shadow-2xl">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                        <span class="text-sm font-black text-indigo-400">اختبار المفردات: ${category.title}</span>
                        <span class="text-xs md:text-sm bg-slate-900 text-slate-200 px-4 py-1.5 rounded-xl font-bold border border-slate-800">السؤال ${vocabExamState.currentIndex + 1} من 10</span>
                    </div>

                    <div class="space-y-3">
                        <h3 class="text-xl md:text-2xl font-black text-white ltr-text text-center">${q.question}</h3>
                    </div>

                    <div class="space-y-3">
                        ${q.options.map((opt, idx) => `
                            <button type="button" onclick="selectVocabExamAnswer(${idx})" class="w-full p-4.5 rounded-2xl text-right text-base font-black border transition-all cursor-pointer ${vocabExamState.userAnswers[vocabExamState.currentIndex] === idx ? 'bg-indigo-600 border-indigo-400 text-white shadow-xl scale-102' : 'bg-slate-900 border-slate-700 text-slate-100 hover:bg-slate-800'}">
                                <span class="ml-3 text-indigo-300">${['أ', 'ب', 'ج', 'د'][idx]})</span> ${opt}
                            </button>
                        `).join('')}
                    </div>

                    <div class="flex justify-between items-center pt-6 border-t border-slate-800">
                        <button type="button" ${vocabExamState.currentIndex === 0 ? 'disabled' : ''} onclick="vocabExamState.currentIndex--; render();" class="py-3.5 px-6 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-black rounded-2xl disabled:opacity-40">
                            ⬅ السابق
                        </button>
                        ${vocabExamState.currentIndex < 9 ? `
                            <button type="button" onclick="vocabExamState.currentIndex++; render();" class="py-3.5 px-8 btn-gradient text-white text-sm font-black rounded-2xl">
                                التالي ➡
                            </button>
                        ` : `
                            <button type="button" onclick="submitVocabExam()" class="py-3.5 px-8 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-black rounded-2xl shadow-xl">
                                تسليم الاختبار 🏁
                            </button>
                        `}
                    </div>
                </div>
            `;
        }

        function initVocabExam(categoryKey) {
            const category = vocabData[categoryKey];
            let questions = [];
            let items = [...category.items].sort(() => 0.5 - Math.random()).slice(0, 10);
            items.forEach(item => {
                let distractors = category.items.filter(i => i.word !== item.word).sort(() => 0.5 - Math.random()).slice(0, 3);
                let options = [item.meaning, ...distractors.map(d => d.meaning)].sort(() => 0.5 - Math.random());
                let correctIdx = options.indexOf(item.meaning);
                questions.push({
                    question: `What is the meaning of "${item.word}"?`,
                    options: options,
                    correct: correctIdx
                });
            });
            vocabExamState = {
                category: categoryKey,
                questions: questions,
                currentIndex: 0,
                userAnswers: {},
                submitted: false,
                score: 0
            };
        }

        function selectVocabExamAnswer(idx) {
            vocabExamState.userAnswers[vocabExamState.currentIndex] = idx;
            render();
        }

        function submitVocabExam() {
            let score = 0;
            vocabExamState.questions.forEach((q, idx) => {
                if (vocabExamState.userAnswers[idx] === q.correct) score++;
            });
            vocabExamState.score = score;
            vocabExamState.submitted = true;
            if (score >= 8) {
                state.points += 5;
                state.stars += 3;
            }
            saveState();
            render();
        }

        function renderGrammarMenuScreen() {
            const levels = [
                { id: 1, title: "Level 1: Simple Present of 'Be' (Affirmative, Negative, Questions & Wh-)", desc: "شرح ضمائر الفاعل وتصريف فعل الكينونة (am, is, are) والنفي والسؤال وأسئلة الاستعلام من الصفر." },
                { id: 2, title: "Level 2: Yes/No Questions & Short Answers", desc: "كيف نسأل بـ (Are you... / Is he...) ونعطي إجابات قصيرة صحيحة." },
                { id: 3, title: "Level 3: Wh- Information Questions", desc: "أسئلة الاستعلام (How, What, When, Where, Who, Why) وتوظيفها بكلمات الوحدة." },
                { id: 4, title: "Level 4: Prepositions of Place", desc: "حروف الجر المكانية (behind, next to, near, on your right) وتحديد المواقع في الفندق." }
            ];

            let html = `
                <div class="space-y-6">
                    <div class="glass-card rounded-3xl p-8 border border-purple-500/40 shadow-xl">
                        <h2 class="text-2xl md:text-3xl font-black text-white mb-3">⚙️ قسم القواعد التفاعلية — Grammar</h2>
                        <p class="text-sm md:text-base text-slate-200 font-semibold">شرح تفاعلي تدريجي (مثل معلم خاص) مع تدريبات فورية واختبار من 20 سؤالاً لكل مستوى.</p>
                    </div>
                    <div class="grid grid-cols-1 gap-6">
            `;

            levels.forEach(lvl => {
                let isUnlocked = state.completedLevels.grammar.includes(lvl.id) || lvl.id === 1 || state.completedLevels.grammar.includes(lvl.id - 1);
                let examScore = state.examScores[lvl.id];

                html += `
                    <div class="glass-card rounded-3xl p-8 border ${isUnlocked ? 'border-slate-700 hover:border-purple-500' : 'border-slate-800 opacity-60'} transition-all shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                        <div>
                            <div class="flex items-center gap-3 mb-3">
                                <span class="text-xs bg-purple-500/20 text-purple-300 px-3.5 py-1.5 rounded-xl border border-purple-500/30 font-black">مستوى ${lvl.id}</span>
                                <h3 class="font-black text-white text-lg md:text-xl">${lvl.title}</h3>
                            </div>
                            <p class="text-sm md:text-base text-slate-300 font-semibold max-w-2xl leading-relaxed">${lvl.desc}</p>
                            ${examScore !== undefined ? `<p class="text-sm font-black text-amber-400 mt-3">⭐ أعلى نتيجة اختبار: ${examScore} / 20 ${examScore >= 17 ? '(ناجح ✅)' : '(يحتاج إعادة محاولة ⚠️)'}</p>` : ''}
                        </div>
                        <div class="flex flex-col sm:flex-row gap-3.5 w-full md:w-auto">
                            ${isUnlocked ? `
                                <button onclick="navigateTo('grammarLearn', {grammarLevel: ${lvl.id}})" class="py-3.5 px-6 btn-gradient text-white text-xs md:text-sm font-black rounded-2xl shadow">
                                    📖 الشرح والتدريبات الفورية
                                </button>
                                <button onclick="navigateTo('grammarExam', {grammarLevel: ${lvl.id}})" class="py-3.5 px-6 bg-purple-600 hover:bg-purple-500 text-white text-xs md:text-sm font-black rounded-2xl shadow">
                                    📝 اختبار المستوى (20 س)
                                </button>
                            ` : `
                                <div class="px-6 py-3.5 bg-slate-900 text-slate-400 text-xs md:text-sm font-black rounded-2xl border border-slate-700 flex items-center gap-2">
                                    🔒 المستوى مغلق (أنهِ المستوى السابق بدرجة 17+)
                                </div>
                            `}
                        </div>
                    </div>
                `;
            });

            html += `</div></div>`;
            return html;
        }

        let grammarStepIndex = 0;
        let interactiveAnswers = {};

        function renderGrammarLearnScreen() {
            const level = state.activeGrammarLevel;
            const steps = getSuperGoalGrammarSteps(level);

            if (grammarStepIndex >= steps.length) grammarStepIndex = steps.length - 1;
            if (grammarStepIndex < 0) grammarStepIndex = 0;

            const currentStep = steps[grammarStepIndex];

            return `
                <div class="space-y-6 max-w-3xl mx-auto">
                    <div class="glass-card rounded-3xl p-6 flex justify-between items-center border border-purple-500/40 shadow-xl">
                        <div>
                            <span class="text-xs bg-purple-500/20 text-purple-300 px-3 py-1 rounded-xl font-black border border-purple-500/30">Grammar Level ${level}</span>
                            <h3 class="font-black text-white text-lg mt-1">شرح تفاعلي خطوة بخطوة</h3>
                        </div>
                        <button onclick="navigateTo('grammarExam', {grammarLevel: ${level}})" class="py-3 px-6 btn-gradient text-white text-xs md:text-sm font-black rounded-2xl shadow">
                            الانتقال للامتحان النهائي 📝
                        </button>
                    </div>

                    <!-- Step Progress Bar -->
                    <div class="glass-card rounded-3xl p-5 border border-slate-700 shadow space-y-3">
                        <div class="flex justify-between text-xs md:text-sm font-black text-slate-200">
                            <span>الخطوة ${grammarStepIndex + 1} من ${steps.length}</span>
                            <span>${Math.round(((grammarStepIndex + 1) / steps.length) * 100)}% مكتمل</span>
                        </div>
                        <div class="w-full bg-slate-900 rounded-full h-3.5 overflow-hidden border border-slate-800">
                            <div class="bg-purple-500 h-3.5 rounded-full transition-all duration-300" style="width: ${((grammarStepIndex + 1) / steps.length) * 100}%"></div>
                        </div>
                    </div>

                    <!-- Step Content Card -->
                    <div class="glass-card rounded-3xl p-8 md:p-10 border-2 border-purple-500/50 shadow-2xl space-y-8">
                        <h4 class="text-xl md:text-2xl font-black text-purple-300 border-b border-slate-800 pb-4 flex items-center gap-3">
                            <span>🔹</span> ${currentStep.title}
                        </h4>

                        <div class="text-slate-200 text-base md:text-lg font-semibold leading-relaxed space-y-4 whitespace-pre-line">
                            ${currentStep.explanation}
                        </div>

                        ${currentStep.examples ? `
                            <div class="bg-slate-900/95 p-6 rounded-3xl border border-slate-800 space-y-4 shadow-inner">
                                <p class="text-xs md:text-sm font-black text-amber-400">أمثلة توضيحية من الوحدة:</p>
                                ${currentStep.examples.map(ex => `
                                    <div class="space-y-1.5">
                                        <p class="text-sm md:text-base font-black text-indigo-300 ltr-text">🇬🇧 ${ex.en}</p>
                                        <p class="text-sm md:text-base text-slate-300 font-semibold">🇸🇦 ${ex.ar}</p>
                                        ${ex.note ? `<p class="text-xs text-amber-300 font-bold">💡 ${ex.note}</p>` : ''}
                                    </div>
                                `).join('<div class="my-3 border-t border-slate-800"></div>')}
                            </div>
                        ` : ''}

                        <!-- Interactive Micro-Exercise for this step -->
                        ${currentStep.exercise ? `
                            <div class="bg-purple-950/40 p-6 rounded-3xl border border-purple-500/40 space-y-4">
                                <p class="text-sm md:text-base font-black text-purple-200">✍️ تمرين تفاعلي فوري: ${currentStep.exercise.question}</p>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                                    ${currentStep.exercise.options.map((opt, oIdx) => {
                                        const ansKey = `step_${grammarStepIndex}`;
                                        const isSelected = interactiveAnswers[ansKey] === oIdx;
                                        const isCorrect = oIdx === currentStep.exercise.correct;
                                        const isAnswered = interactiveAnswers[ansKey] !== undefined;
                                        
                                        let btnStyle = 'bg-slate-900 border-slate-700 text-slate-100 hover:bg-slate-800';
                                        if (isAnswered) {
                                            if (isCorrect) btnStyle = 'bg-emerald-600/40 border-emerald-500 text-emerald-200';
                                            else if (isSelected) btnStyle = 'bg-rose-600/40 border-rose-500 text-rose-200';
                                        }

                                        return `
                                            <button type="button" onclick="answerGrammarStep(${grammarStepIndex}, ${oIdx})" class="p-4 rounded-2xl text-sm font-black border transition-all cursor-pointer ltr-text text-center ${btnStyle}">
                                                ${opt}
                                            </button>
                                        `;
                                    }).join('')}
                                </div>
                                ${interactiveAnswers[`step_${grammarStepIndex}`] !== undefined ? `
                                    <p class="text-sm font-black ${interactiveAnswers[`step_${grammarStepIndex}`] === currentStep.exercise.correct ? 'text-emerald-400' : 'text-rose-400'} pt-2">
                                        ${interactiveAnswers[`step_${grammarStepIndex}`] === currentStep.exercise.correct ? '✅ إجابة صحيحة! أحسنت يا بطل.' : '❌ إجابة غير دقيقة. حاول مرة أخرى أو راجع الشرح.'}
