        function answerGrammarStep(stepIdx, optionIdx) {
            interactiveAnswers[`step_${stepIdx}`] = optionIdx;
            render();
        }

        function getSuperGoalGrammarSteps(level) {
            if (level === 1) {
                return [
                    {
                        title: "1. ضمائر الفاعل في اللغة الإنجليزية (Subject Pronouns)",
                        explanation: "يا بطل، لكي نبدأ أي جملة في الإنجليزية نحتاج إلى فاعل (Subject). ضمائر الفاعل هي:\n• I (أنا)\n• He (هو للمذكر)\n• She (هي للمؤنث)\n• It (هو/هي لغير العادي والمعادن والحيوانات)\n• We (نحن)\n• You (أنت / أنتم)\n• They (هم / هن)",
                        examples: [
                            { en: "I am on vacation.", ar: "أنا في إجازة." },
                            { en: "He is at the reception desk.", ar: "هو في مكتب الاستقبال." }
                        ],
                        exercise: {
                            question: "أي ضمير نستخدمه للحديث عن فتاة مفردة (مثال: سارة)؟",
                            options: ["He", "She"],
                            correct: 1
                        }
                    },
                    {
                        title: "2. تصريف فعل الكينونة Be (في الإثبات Affirmative)",
                        explanation: "فعل الكينونة (Be) هو أهم فعل في الإنجليزية ويُستخدم للتعبير عن الحالة والهوية ومكان الوجود. يتصرف مع الضمائر هكذا:\n• I ➔ am ('m)\n• He / She / It ➔ is ('s)\n• We / You / They ➔ are ('re)",
                        examples: [
                            { en: "I'm in a nice hotel.", ar: "أنا في فندق جميل." },
                            { en: "They're from Egypt.", ar: "هم من مصر." }
                        ],
                        exercise: {
                            question: "اختر الفعل المساعد المناسب للضمير He:",
                            options: ["am", "is", "are"],
                            correct: 1
                        }
                    },
                    {
                        title: "3. نفي فعل الكينونة Be (Negative)",
                        explanation: "لكي ننفي الجملة ونقول (لسنا / لستُ / ليس كذلك)، نضع كلمة not مباشرة بعد الفعل المساعد (am / is / are).\n• I am not ('m not)\n• He / She / It is not (isn't)\n• We / You / They are not (aren't)",
                        examples: [
                            { en: "I'm not here on business.", ar: "أنا لست هنا في رحلة عمل." },
                            { en: "The elevator isn't working.", ar: "المصعد لا يعمل." }
                        ],
                        exercise: {
                            question: "اختر النفي الصحيح لـ: They are on vacation.",
                            options: ["They aren't on vacation.", "They isn't on vacation."],
                            correct: 0
                        }
                    },
                    {
                        title: "4. تكوين أسئلة نعم/لا والإجابات القصيرة (Yes/No Questions)",
                        explanation: "لكي نسأل سؤالاً إجابته بـ (نعم Yes) أو (لا No)، نقوم بعكس مكان الفاعل والفعل المساعد في بداية الجملة:\n• الفعل المساعد (Am / Is / Are) + الفاعل + بقية الجملة؟\n\nالإجابات القصيرة:\n• Yes, I am. / No, I'm not.\n• Yes, he is. / No, he isn't.\n• Yes, they are. / No, they aren't.",
                        examples: [
                            { en: "Are you here on vacation? - Yes, I am.", ar: "هل أنت هنا في إجازة؟ - نعم، أنا كذلك." }
                        ],
                        exercise: {
                            question: "السؤال الصحيح مع الضمير You هو:",
                            options: ["Is you here?", "Are you here?"],
                            correct: 1
                        }
                    },
                    {
                        title: "5. أسئلة الاستعلام (Wh- Information Questions)",
                        explanation: "أسئلة المعلومات تبدأ بأداة استفهام (Wh- word) لمعرفة تفاصيل دقيقة:\n• How (كيف): How are you doing?\n• What (ما/ماذا): What are your names?\n• When (متى): When is the festival?\n• Where (أين): Where are you from?\n• Who (من): Who is that tall man?\n• Why (لماذا): Why are you studying?",
                        examples: [
                            { en: "Where are you from? — I am from Riyadh.", ar: "من أين أنت؟ — أنا من الرياض." }
                        ],
                        exercise: {
                            question: "الأداة المناسبة للسؤال عن المكان هي:",
                            options: ["When", "Where", "Who"],
                            correct: 1
                        }
                    }
                ];
            } else if (level === 2) {
                return [
                    {
                        title: "1. بناء أسئلة Yes/No بالكامل",
                        explanation: "عند الرغبة في الاستفسار عن حقيقة أو ظرف حالي، نبدأ بـ Am أو Is أو Are بناءً على الفاعل.",
                        examples: [
                            { en: "Is Ahmed happy in his new job?", ar: "هل أحمد سعيد في عمله الجديد؟" },
                            { en: "Are they from Egypt?", ar: "هل هم من مصر؟" }
                        ],
                        exercise: {
                            question: "اختر السؤال الصحيح للفاعل المفرد (he):",
                            options: ["Are he from Saudi Arabia?", "Is he from Saudi Arabia?"],
                            correct: 1
                        }
                    },
                    {
                        title: "2. إتقان الإجابات القصيرة",
                        explanation: "لاكتفاء الإجابة بمهذبية دون تكرار الجملة كاملة:\n• Yes, he is. / No, he isn't.\n• Yes, they are. / No, they aren't.",
                        examples: [
                            { en: "Are they tourists? - No, they aren't.", ar: "هل هم سياح؟ - لا، ليسوا كذلك." }
                        ],
                        exercise: {
                            question: "الإجابة القصيرة المناسبة لـ: Is she a receptionist? بـ (نعم):",
                            options: ["Yes, she is.", "Yes, she am."],
                            correct: 0
                        }
                    }
                ];
            } else if (level === 3) {
                return [
                    {
                        title: "1. أدوات الاستفهام Wh- بالتفصيل",
                        explanation: "نستخدم What للأسماء، Where للأماكن، When للأوقات، Who للأشخاص، How للطريقة أو الحال.",
                        examples: [
                            { en: "What are your names?", ar: "ما هي أسماؤكم؟" },
                            { en: "Who's that tall man at the desk?", ar: "من ذلك الرجل الطويل عند المكتب؟" }
                        ],
                        exercise: {
                            question: "الأداة المناسبة للسؤال عن وقت المهرجان (When's the festival) هي:",
                            options: ["When", "Where"],
                            correct: 0
                        }
                    }
                ];
            } else {
                return [
                    {
                        title: "1. حروف الجر المكانية (Prepositions of Place)",
                        explanation: "لوصف مواقع الأشياء بدقة داخل الفندق أو المدينة، نستخدم حروف الجر:\n• behind (خلف)\n• on your right (على يمينك)\n• next to (بجوار / ملاصق)\n• near (بالقرب من)",
                        examples: [
                            { en: "The reception desk is near the elevator.", ar: "مكتب الاستقبال بالقرب من المصعد." },
                            { en: "The key card is next to the phone.", ar: "بطاقة المفتاح بجوار الهاتف." }
                        ],
                        exercise: {
                            question: "حرف الجر الذي يعني (بجوار أو ملاصق لـ) هو:",
                            options: ["behind", "next to"],
                            correct: 1
                        }
                    }
                ];
            }
        }

        let grammarExamState = {
            level: null,
            questions: [],
            currentIndex: 0,
            userAnswers: {},
            submitted: false,
            score: 0
        };

        function renderGrammarExamScreen() {
            const level = state.activeGrammarLevel;
            if (!grammarExamState.questions.length || grammarExamState.level !== level) {
                initGrammarExam(level);
            }

            const q = grammarExamState.questions[grammarExamState.currentIndex];

            if (grammarExamState.submitted) {
                let passed = grammarExamState.score >= 17;
                return `
                    <div class="glass-card rounded-3xl p-8 md:p-10 max-w-2xl mx-auto text-center space-y-6 border border-slate-700 shadow-2xl">
                        <div class="text-6xl">${passed ? '🏆' : '⚠️'}</div>
                        <h3 class="text-3xl font-black text-white">نتيجة امتحان المستوى ${level}</h3>
                        <div class="text-4xl font-black ${passed ? 'text-emerald-400' : 'text-rose-400'}">
                            ${grammarExamState.score} / 20
                        </div>
                        <p class="text-base font-semibold text-slate-200">
                            ${passed ? 'مبارك! لقد اجتزت الاختبار بنجاح وتم فتح المستوى التالي!' : 'لم تصل لدرجة النجاح (17 من 20). راجع الأخطاء أدناه وحاول مرة أخرى.'}
                        </p>

                        <div class="space-y-3 text-right max-h-60 overflow-y-auto p-3">
                            <h4 class="font-black text-white text-sm">مراجعة الأسئلة والأخطاء:</h4>
                            ${grammarExamState.questions.map((quest, idx) => {
                                let userAns = grammarExamState.userAnswers[idx];
                                let isCorr = userAns === quest.correct;
                                return `
                                    <div class="p-4 rounded-2xl bg-slate-900 border ${isCorr ? 'border-emerald-500/40 text-emerald-300' : 'border-rose-500/40 text-rose-300'} text-xs md:text-sm space-y-1">
                                        <p class="font-black text-white ltr-text">${idx + 1}. ${quest.question}</p>
                                        <p>إجابتك: ${userAns !== undefined ? quest.options[userAns] : 'لم تقم بالإجابة'} ${isCorr ? '✅' : '❌'}</p>
                                        ${!isCorr ? `<p class="text-emerald-400 font-bold">الإجابة الصحيحة: ${quest.options[quest.correct]}</p>` : ''}
                                        <p class="text-slate-400 font-semibold">💡 الشرح: ${quest.explanation}</p>
                                    </div>
                                ` ;
                            }).join('')}
                        </div>

                        <div class="flex gap-4 pt-4">
                            <button type="button" onclick="initGrammarExam(${level}); render();" class="flex-1 py-4 bg-slate-800 hover:bg-slate-700 text-white font-black rounded-2xl border border-slate-700 text-sm">
                                إعادة الامتحان بأسئلة جديدة 🔄
                            </button>
                            <button type="button" onclick="navigateTo('grammarMenu')" class="flex-1 py-4 btn-gradient text-white font-black rounded-2xl text-sm">
                                العودة لقائمة القواعد ⚙️
                            </button>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="glass-card rounded-3xl p-8 md:p-10 max-w-2xl mx-auto space-y-6 border border-slate-700 shadow-2xl">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                        <span class="text-sm font-black text-purple-400">امتحان المستوى ${level} (قواعد SuperGoal 2)</span>
                        <span class="text-xs md:text-sm bg-slate-900 text-slate-200 px-4 py-1.5 rounded-xl font-bold border border-slate-800">السؤال ${grammarExamState.currentIndex + 1} من 20</span>
                    </div>

                    <div class="space-y-3">
                        <h3 class="text-xl md:text-2xl font-black text-white ltr-text text-center">${q.question}</h3>
                    </div>

                    <div class="space-y-3">
                        ${q.options.map((opt, idx) => `
                            <button type="button" onclick="selectGrammarExamAnswer(${idx})" class="w-full p-4.5 rounded-2xl text-right text-base font-black border transition-all cursor-pointer ${grammarExamState.userAnswers[grammarExamState.currentIndex] === idx ? 'bg-purple-600 border-purple-400 text-white shadow-xl scale-102' : 'bg-slate-900 border-slate-700 text-slate-100 hover:bg-slate-800'}">
                                <span class="ml-3 text-purple-300">${['أ', 'ب', 'ج', 'د'][idx]})</span> ${opt}
                            </button>
                        `).join('')}
                    </div>

                    <div class="flex justify-between items-center pt-6 border-t border-slate-800">
                        <button type="button" ${grammarExamState.currentIndex === 0 ? 'disabled' : ''} onclick="grammarExamState.currentIndex--; render();" class="py-3.5 px-6 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-black rounded-2xl disabled:opacity-40">
                            ⬅ السابق
                        </button>
                        ${grammarExamState.currentIndex < 19 ? `
                            <button type="button" onclick="grammarExamState.currentIndex++; render();" class="py-3.5 px-8 btn-gradient text-white text-sm font-black rounded-2xl">
                                التالي ➡
                            </button>
                        ` : `
                            <button type="button" onclick="submitGrammarExam()" class="py-3.5 px-8 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-black rounded-2xl shadow-xl">
                                تسليم الامتحان 🏁
                            </button>
                        `}
                    </div>
                </div>
            `;
        }

        function initGrammarExam(level) {
            grammarExamState = {
                level: level,
                questions: generateGrammarExamQuestions(level),
                currentIndex: 0,
                userAnswers: {},
                submitted: false,
                score: 0
            };
        }

        function selectGrammarExamAnswer(idx) {
            grammarExamState.userAnswers[grammarExamState.currentIndex] = idx;
            render();
        }

        function submitGrammarExam() {
            let score = 0;
            grammarExamState.questions.forEach((q, idx) => {
                if (grammarExamState.userAnswers[idx] === q.correct) score++;
            });
            grammarExamState.score = score;
            grammarExamState.submitted = true;
            state.examScores[grammarExamState.level] = score;

            if (score >= 17) {
                state.points += 10;
                state.stars += 5;
                if (!state.completedLevels.grammar.includes(grammarExamState.level + 1) && grammarExamState.level < 4) {
                    state.completedLevels.grammar.push(grammarExamState.level + 1);
                }
            }
            saveState();
            render();
        }

        function generateGrammarExamQuestions(level) {
            let qs = [];
            for (let i = 0; i < 20; i++) {
                if (level === 1) {
                    const pool = [
                        { q: "I _____ here on vacation.", ops: ["am", "is", "are", "be"], corr: 0, exp: "الضمير I يأخذ دائماً الفعل am." },
                        { q: "He _____ at the reception desk.", ops: ["am", "is", "are", "be"], corr: 1, exp: "الضمير المفرد المذكر He يأخذ is." },
                        { q: "They _____ from Saudi Arabia.", ops: ["am", "is", "are", "be"], corr: 2, exp: "الضمير الجمع They يأخذ are." },
                        { q: "She _____ not on business.", ops: ["am", "is", "are", "be"], corr: 1, exp: "النفي مع She يكون isn't." },
                        { q: "We _____ in a nice hotel.", ops: ["am", "is", "are", "be"], corr: 2, exp: "الضمير We يأخذ are." },
                        { q: "You _____ a polite receptionist.", ops: ["am", "is", "are", "be"], corr: 2, exp: "الضمير You يأخذ are." },
                        { q: "The key card _____ on the desk.", ops: ["am", "is", "are", "be"], corr: 1, exp: "الاسم المفرد غير العاقل key card يأخذ is." },
                        { q: "I _____ not tired.", ops: ["am", "is", "are", "be"], corr: 0, exp: "النفي مع I يكون am not." },
                        { q: "Ahmed and Ali _____ students.", ops: ["am", "is", "are", "be"], corr: 2, exp: "الفاعل المثنى أو الجمع يأخذ are." },
                        { q: "The elevator _____ working.", ops: ["isn't", "aren't", "am not", "not"], corr: 0, exp: "المفرد المنفي يأخذ isn't." }
                    ];
                    let base = pool[i % pool.length];
                    qs.push({ question: base.q, options: base.ops, correct: base.corr, explanation: base.exp });
                } else if (level === 2) {
                    const pool = [
                        { q: "_____ you here on vacation?", ops: ["Am", "Is", "Are", "Be"], corr: 2, exp: "السؤال مع you يبدأ بـ Are." },
                        { q: "_____ Ahmed happy in his job?", ops: ["Am", "Is", "Are", "Be"], corr: 1, exp: "السؤال مع المفرد Ahmed يبدأ بـ Is." },
                        { q: "Are they from Egypt? - Yes, they _____.", ops: ["am", "is", "are", "aren't"], corr: 2, exp: "الإجابة الإيجابية القصيرة مع they هي Yes, they are." },
                        { q: "Is she a receptionist? - No, she _____.", ops: ["isn't", "aren't", "am not", "is"], corr: 0, exp: "النفي القصير مع she هو No, she isn't." },
                        { q: "_____ you ready to fill in the form?", ops: ["Am", "Is", "Are", "Be"], corr: 2, exp: "السؤال موجه لـ you فيأخذ Are." },
                        { q: "Are you on vacation? - Yes, I _____.", ops: ["am", "is", "are", "do"], corr: 0, exp: "الإجابة بـ I تأخذ Yes, I am." },
                        { q: "Is the hotel near the festival? - Yes, it _____.", ops: ["am", "is", "are", "be"], corr: 1, exp: "الإجابة مع it تأخذ Yes, it is." },
                        { q: "Are they tourists? - No, they _____.", ops: ["is", "isn't", "aren't", "am not"], corr: 2, exp: "النفي مع they يأخذ aren't." },
                        { q: "_____ he the concierge?", ops: ["Am", "Is", "Are", "Be"], corr: 1, exp: "السؤال مع he يبدأ بـ Is." },
                        { q: "Is she on business? - Yes, she _____.", ops: ["am", "is", "are", "be"], corr: 1, exp: "الإجابة مع she تأخذ is." }
                    ];
                    let base = pool[i % pool.length];
                    qs.push({ question: base.q, options: base.ops, correct: base.corr, explanation: base.exp });
                } else if (level === 3) {
                    const pool = [
                        { q: "_____ are you from?", ops: ["What", "Where", "When", "Who"], corr: 1, exp: "السؤال عن بلد الأصل يستخدم Where." },
                        { q: "_____ is your name?", ops: ["Where", "What", "Who", "When"], corr: 1, exp: "السؤال عن الاسم يستخدم What." },
                        { q: "_____ is the festival?", ops: ["Where", "What", "When", "Why"], corr: 2, exp: "السؤال عن الوقت والموعد يستخدم When." },
                        { q: "_____ is that tall man at the desk?", ops: ["What", "Where", "Who", "When"], corr: 2, exp: "السؤال عن الأشخاص يستخدم Who." },
                        { q: "_____ are you studying?", ops: ["Why", "Where", "When", "Who"], corr: 0, exp: "السؤال عن السبب يستخدم Why." },
                        { q: "_____'re you doing?", ops: ["How", "Where", "When", "Who"], corr: 0, exp: "التعبير عن الحال أو الفعل يستخدم How." },
                        { q: "Where _____ you staying?", ops: ["am", "is", "are", "be"], corr: 2, exp: "بعد Where مع you نستخدم are." },
                        { q: "What _____ your address?", ops: ["am", "is", "are", "be"], corr: 1, exp: "Address اسم مفرد يأخذ is." },
                        { q: "Who _____ the concierge?", ops: ["am", "is", "are", "be"], corr: 1, exp: "الكونسيرج مفرد يأخذ is." },
                        { q: "When _____ your date of birth?", ops: ["am", "is", "are", "be"], corr: 1, exp: "تاريخ الميلاد مفرد يأخذ is." }
                    ];
                    let base = pool[i % pool.length];
                    qs.push({ question: base.q, options: base.ops, correct: base.corr, explanation: base.exp });
                } else {
                    const pool = [
                        { q: "The elevator is _____ the reception desk.", ops: ["behind", "on your right", "near", "all are correct"], corr: 3, exp: "جميع حروف الجر صحيحة سياقياً لوصف المكان." },
                        { q: "Turn right, the hotel is _____.", ops: ["behind", "on your right", "at", "in"], corr: 1, exp: "التعبير الصحيح هو on your right." },
                        { q: "The key card is _____ the phone.", ops: ["next to", "in", "at", "on"], corr: 0, exp: "التعبير الصحيح هو next to (بجوار)." },
                        { q: "The reception desk is _____ the main entrance.", ops: ["near", "behind", "next to", "all are correct"], corr: 3, exp: "يمكن استخدام أي من حروف الجر حسب موقع الاستقبال." },
                        { q: "Where is the elevator? It's _____ the stairs.", ops: ["behind", "on", "at", "in"], corr: 0, exp: "behind تعني خلف السلالم." },
                        { q: "Is the restaurant near here? Yes, it's _____.", ops: ["near", "behind", "next to", "all are correct"], corr: 3, exp: "إجابة صحيحة لتحديد القرب." },
                        { q: "The room key is _____ my pocket.", ops: ["in", "on", "at", "behind"], corr: 0, exp: "داخل الجيب يستخدم حرف الجر in." },
                        { q: "Stand _____ the door, please.", ops: ["near", "on", "in", "to"], corr: 0, exp: "قف بالقرب من الباب (near)." },
                        { q: "The concierge is standing _____ the desk.", ops: ["behind", "on", "in", "at"], corr: 0, exp: "يقف خلف المكتب (behind)." },
                        { q: "Your room is just _____.", ops: ["on your right", "behind", "near", "all are correct"], corr: 3, exp: "تعبيرات صحيحة لتحديد الاتجاهات في الفندق." }
                    ];
                    let base = pool[i % pool.length];
                    qs.push({ question: base.q, options: base.ops, correct: base.corr, explanation: base.exp });
                }
            }
            return qs;
        }

        function renderReviewScreen() {
            return `
                <div class="glass-card rounded-3xl p-8 md:p-10 max-w-2xl mx-auto space-y-6 border border-emerald-500/40 text-center shadow-2xl">
                    <div class="text-6xl">🎯</div>
                    <h3 class="text-3xl font-black text-white">المراجعة الشاملة — Comprehensive Review</h3>
                    <p class="text-slate-200 text-base md:text-lg font-semibold leading-relaxed">
                        لقد أتممت استعراض كافة المفردات والقواعد لوحدة SuperGoal 2 (Are You Here on Vacation?). يمكنك إعادة التدريب على المفردات أو القواعد في أي وقت.
                    </p>
                    <div class="flex flex-col sm:flex-row gap-4 pt-4">
                        <button type="button" onclick="navigateTo('vocabMenu')" class="flex-1 py-4 btn-gradient text-white font-black rounded-2xl text-sm">
                            مراجعة المفردات 📚
                        </button>
                        <button type="button" onclick="navigateTo('grammarMenu')" class="flex-1 py-4 bg-purple-600 hover:bg-purple-500 text-white font-black rounded-2xl text-sm">
                            مراجعة القواعد ⚙️
                        </button>
                    </div>
                </div>
            `;
        }

        function renderProgressScreen() {
            let totalWords = 0;
            Object.values(vocabData).forEach(cat => totalWords += cat.items.length);
            let learnedCount = state.learnedWords.length;
            let percent = Math.round((learnedCount / totalWords) * 100);

            return `
                <div class="glass-card rounded-3xl p-8 md:p-10 max-w-2xl mx-auto space-y-6 border border-amber-500/40 shadow-2xl">
                    <div class="text-center">
                        <div class="text-6xl mb-3">📊</div>
                        <h3 class="text-3xl font-black text-white">تقدمي في المغامرة — My Progress</h3>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 text-center shadow-inner">
                            <span class="text-4xl font-black text-amber-400">${state.stars}</span>
                            <p class="text-sm text-slate-300 font-bold mt-2">النجوم المحققة ⭐</p>
                        </div>
                        <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 text-center shadow-inner">
                            <span class="text-4xl font-black text-indigo-400">${state.points}</span>
                            <p class="text-sm text-slate-300 font-bold mt-2">إجمالي النقاط 🏆</p>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <div class="flex justify-between text-sm font-black text-slate-200">
                            <span>إتقان المفردات</span>
                            <span>${learnedCount} / ${totalWords} (${percent}%)</span>
                        </div>
                        <div class="w-full bg-slate-900 rounded-full h-4 overflow-hidden border border-slate-800">
                            <div class="bg-gradient-to-r from-indigo-500 to-emerald-500 h-4 rounded-full" style="width: ${percent}%"></div>
                        </div>
                    </div>

                    <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-3 shadow-inner">
                        <h4 class="font-black text-white text-sm">حالة حفظ التقدم:</h4>
                        <p class="text-sm text-slate-300 font-semibold">✅ يتم حفظ نقاطك، نجومك، والكلمات التي أتقنتها تلقائياً في جهازك (LocalStorage) لضمان استمرار تقدمك بسلاسة.</p>
                    </div>
                </div>
            `;
        }

        function renderAchievementsScreen() {
            const badges = [
                { title: "مستكشف الفندق", desc: "أتقن 10 كلمات جديدة", unlocked: state.learnedWords.length >= 10, icon: "🏨" },
                { title: "خبير فعل Be", desc: "اجتاز امتحان المستوى الأول بنجاح", unlocked: (state.examScores[1] || 0) >= 17, icon: "⚙️" },
                { title: "سيد الأسئلة", desc: "أتم جميع مستويات القواعد والامتحانات", unlocked: (state.examScores[4] || 0) >= 17, icon: "✈️" },
                { title: "بطل المغامرة", desc: "اجمع أكثر من 30 نقطة تفاعلية", unlocked: state.points >= 30, icon: "🏆" }
            ];

            return `
                <div class="glass-card rounded-3xl p-8 md:p-10 max-w-2xl mx-auto space-y-6 border border-sky-500/40 shadow-2xl">
                    <div class="text-center">
                        <div class="text-6xl mb-3">🏆</div>
                        <h3 class="text-3xl font-black text-white">الإنجازات والأوسمة — Achievements</h3>
                    </div>

                    <div class="grid grid-cols-1 gap-4">
                        ${badges.map(b => `
                            <div class="p-5 rounded-3xl border flex items-center gap-5 ${b.unlocked ? 'bg-sky-500/15 border-sky-500/50 text-white' : 'bg-slate-900 border-slate-800 text-slate-400 opacity-60'} shadow">
                                <div class="text-4xl">${b.icon}</div>
                                <div>
                                    <h4 class="font-black text-base ${b.unlocked ? 'text-sky-300' : 'text-slate-300'}">${b.title}</h4>
                                    <p class="text-sm text-slate-300 font-semibold">${b.desc}</p>
                                </div>
                                <div class="mr-auto">
                                    <span class="text-xs font-black px-4 py-2 rounded-2xl ${b.unlocked ? 'bg-sky-500/20 text-sky-300 border border-sky-500/40' : 'bg-slate-800 text-slate-400'}">
                                        ${b.unlocked ? 'مُحرز ✅' : 'مقفل 🔒'}
                                    </span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
